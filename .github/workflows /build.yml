name: Build dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Проверить файлы
        run: |
          for f in Tweak.mm sounds.h; do
            [ -f "$f" ] || { echo "::error::Нет файла $f в корне репозитория (имена строго Tweak.mm и sounds.h)"; exit 1; }
          done
          ls -la

      - name: Собрать libstandarling.dylib
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang++ \
            -arch arm64 -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc -O2 -I. -fvisibility=hidden \
            -Wno-deprecated-declarations \
            -dynamiclib -x objective-c++ Tweak.mm \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -framework QuartzCore -framework CoreGraphics \
            -Wl,-dead_strip \
            -install_name @executable_path/Frameworks/libstandarling.dylib \
            -o build/libstandarling.dylib

      - name: Подпись (ad-hoc) и проверка
        run: |
          codesign -f -s - build/libstandarling.dylib
          otool -L build/libstandarling.dylib
          lipo -info build/libstandarling.dylib
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: libstandarling
          path: build/libstandarling.dylib
          if-no-files-found: error
